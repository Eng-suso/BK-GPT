name: Golden set eval

# L'estrattore misurato con un LLM vero sul golden set (tests/golden).
# Notturno e non su ogni push: chiama il modello e non e' deterministico.
# Il modello e' quello dei test (tests/live_llm.py), non OpenAI: un endpoint
# compatibile OpenAI gratuito o economico, dichiarato da due variabili e un
# secret del repository:
#   vars.DELIR_TEST_LLM_BASE_URL, vars.DELIR_TEST_LLM_MODEL, secrets.DELIR_TEST_LLM_API_KEY
# Il tratto deterministico - dal piano al disegno - gira gia' in CI/CD Pipeline.

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  group: golden-eval
  cancel-in-progress: false

# Il job legge il repository e chiama il modello: nessun permesso di scrittura.
permissions:
  contents: read

jobs:
  golden-eval:
    name: Golden set (LLM reale)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      UV_CACHE_DIR: .uv-cache
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
      POSTGRES_PORT: "5432"
      NEO4J_BOLT_PORT: "7687"
      NEO4J_HTTP_PORT: "7474"
      WORKSPACE_DATABASE_URL: postgresql+psycopg://delir_workspace:ci-workspace@127.0.0.1:5432/workspace
      CANONICAL_DATABASE_URL: postgresql+psycopg://delir_app:ci-app@127.0.0.1:5432/delir
      CANONICAL_MIGRATOR_URL: postgresql+psycopg://delir_migrator:ci-migrator@127.0.0.1:5432/delir
      CANONICAL_WORKER_URL: postgresql+psycopg://delir_worker:ci-worker@127.0.0.1:5432/delir
      NEO4J_URL: bolt://127.0.0.1:7687
      NEO4J_PASSWORD: ci-neo4j

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Il token non resta nel workspace mentre girano test e client esterni.
          persist-credentials: false

      # Senza modello i test del golden set si saltano e il job risulta verde
      # senza aver misurato niente: un eval che passa perche' non e' partito e'
      # peggio di un eval rosso.
      - name: Require the test model
        env:
          DELIR_TEST_LLM_BASE_URL: ${{ vars.DELIR_TEST_LLM_BASE_URL }}
          DELIR_TEST_LLM_MODEL: ${{ vars.DELIR_TEST_LLM_MODEL }}
          DELIR_TEST_LLM_API_KEY: ${{ secrets.DELIR_TEST_LLM_API_KEY }}
        run: |
          missing=""
          [ -z "$DELIR_TEST_LLM_BASE_URL" ] && missing="$missing vars.DELIR_TEST_LLM_BASE_URL"
          [ -z "$DELIR_TEST_LLM_MODEL" ] && missing="$missing vars.DELIR_TEST_LLM_MODEL"
          [ -z "$DELIR_TEST_LLM_API_KEY" ] && missing="$missing secrets.DELIR_TEST_LLM_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::modello dei test non configurato, mancano:$missing"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Start data stack (Postgres + Neo4j)
        run: |
          cat > ops/.env <<'EOF'
          POSTGRES_PORT=5432
          POSTGRES_SUPER_PASSWORD=ci-super
          DELIR_MIGRATOR_PASSWORD=ci-migrator
          DELIR_APP_PASSWORD=ci-app
          DELIR_WORKER_PASSWORD=ci-worker
          DELIR_MEM0_PASSWORD=ci-mem0
          DELIR_WORKSPACE_PASSWORD=ci-workspace
          NEO4J_PASSWORD=ci-neo4j
          NEO4J_HTTP_PORT=7474
          NEO4J_BOLT_PORT=7687
          EOF
          docker compose -f ops/docker-compose.yml up -d --wait --wait-timeout 240

      - name: Run migrations (canonical + workspace)
        run: |
          uv run alembic upgrade head
          uv run alembic -c alembic_workspace.ini upgrade head

      # DELIR_LIVE_LLM=1 e' l'opt-in che il test chiede: senza, si salterebbe.
      # `-rs` scrive il motivo di ogni skip, cosi' un caso non misurato si vede.
      - name: Run golden eval
        env:
          DELIR_GOLDEN_EVAL: "1"
          DELIR_LIVE_LLM: "1"
          DELIR_TEST_LLM_BASE_URL: ${{ vars.DELIR_TEST_LLM_BASE_URL }}
          DELIR_TEST_LLM_MODEL: ${{ vars.DELIR_TEST_LLM_MODEL }}
          DELIR_TEST_LLM_API_KEY: ${{ secrets.DELIR_TEST_LLM_API_KEY }}
        run: uv run pytest tests/evals/l1_golden/test_golden_set.py -v -s -rs --tb=short

      - name: Upload golden reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-reports
          path: tests/golden/reports/
          retention-days: 30

      # Solo se lo stack e' partito: senza ops/.env compose non sa nemmeno
      # leggere il file, e un passo di pulizia rosso nasconde il motivo vero.
      - name: Stop data stack
        if: always()
        run: |
          if [ -f ops/.env ]; then
            docker compose -f ops/docker-compose.yml down -v
          fi
