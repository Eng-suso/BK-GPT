name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UV_CACHE_DIR: .uv-cache
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
      # stack dati reale (nessun fallback SQLite): lo alza docker compose
      POSTGRES_PORT: "5432"
      NEO4J_BOLT_PORT: "7687"
      NEO4J_HTTP_PORT: "7474"
      WORKSPACE_DATABASE_URL: postgresql+psycopg://delir_workspace:ci-workspace@127.0.0.1:5432/workspace
      CANONICAL_DATABASE_URL: postgresql+psycopg://delir_app:ci-app@127.0.0.1:5432/delir
      CANONICAL_MIGRATOR_URL: postgresql+psycopg://delir_migrator:ci-migrator@127.0.0.1:5432/delir
      CANONICAL_WORKER_URL: postgresql+psycopg://delir_worker:ci-worker@127.0.0.1:5432/delir
      NEO4J_URL: bolt://127.0.0.1:7687
      NEO4J_PASSWORD: ci-neo4j

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check backend/graphs backend/schemas backend/services tests

      - name: Mypy check
        run: uv run mypy

      - name: Compile Python sources
        run: uv run python -m compileall -q backend tests

      - name: Start data stack (Postgres + Neo4j)
        run: |
          cat > ops/.env <<'EOF'
          POSTGRES_PORT=5432
          POSTGRES_SUPER_PASSWORD=ci-super
          DELIR_MIGRATOR_PASSWORD=ci-migrator
          DELIR_APP_PASSWORD=ci-app
          DELIR_WORKER_PASSWORD=ci-worker
          DELIR_MEM0_PASSWORD=ci-mem0
          DELIR_WORKSPACE_PASSWORD=ci-workspace
          NEO4J_PASSWORD=ci-neo4j
          NEO4J_HTTP_PORT=7474
          NEO4J_BOLT_PORT=7687
          EOF
          docker compose -f ops/docker-compose.yml up -d --wait --wait-timeout 240

      - name: Run migrations (canonical + workspace)
        run: |
          uv run alembic upgrade head
          uv run alembic -c alembic_workspace.ini upgrade head

      - name: Run pytest
        env:
          OPENAI_API_KEY: ""
          MEM0_API_KEY: ""
          TAVILY_API_KEY: ""
        run: uv run pytest tests/ -v --tb=short --junit-xml=pytest-results.xml

      - name: Stop data stack
        if: always()
        run: docker compose -f ops/docker-compose.yml down -v

      - name: Upload pytest report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: pytest-results.xml
          retention-days: 7

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Vitest coverage
        run: npm run test:coverage

      - name: Upload Vitest coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-coverage
          path: frontend/coverage/
          retention-days: 7

      - name: Storybook build
        run: npm run storybook:build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload Storybook build
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storybook-static
          path: frontend/storybook-static/
          retention-days: 3

  playwright:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the projects declared in playwright.config.ts.
        # Firefox is not a configured project; visual + lighthouse are opt-in
        # (RUN_VISUAL / RUN_LIGHTHOUSE) and not gated here.
        project:
          - chromium
          - webkit
          - mobile-chrome
          - mobile-safari

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install ${{ (matrix.project == 'mobile-chrome' && 'chromium') || (matrix.project == 'mobile-safari' && 'webkit') || matrix.project }} --with-deps

      # Frontend-only e2e: the dev server (webServer in playwright.config.ts) is
      # the only process. No backend, so no Python and no LLM keys here — the
      # full-stack e2e will live in its own job.
      - name: Run Playwright tests
        env:
          CI: "true"
        run: npx playwright test --project=${{ matrix.project }} --reporter=html,list

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 7

  ci-success:
    name: All CI checks passed
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality, playwright]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.backend-quality.result }}" != "success" ]]; then
            echo "backend-quality failed"
            exit 1
          fi
          if [[ "${{ needs.frontend-quality.result }}" != "success" ]]; then
            echo "frontend-quality failed"
            exit 1
          fi
          if [[ "${{ needs.playwright.result }}" != "success" ]]; then
            echo "playwright failed"
            exit 1
          fi
          echo "All CI jobs passed"
