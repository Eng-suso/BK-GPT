name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────
# BACKEND TESTS (Python / FastAPI / pytest)
# ─────────────────────────────────────────────────────────────
jobs:
  backend-tests:
    name: "Backend Tests (pytest)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Run pytest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-fake-key-for-ci' }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || 'tvly-test-fake-key-for-ci' }}
        run: uv run pytest tests/ -v --tb=short --junit-xml=pytest-results.xml

      - name: Upload pytest report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: pytest-results.xml
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # FRONTEND QUALITY GATE
  # ─────────────────────────────────────────────────────────────
  frontend-quality:
    name: " Frontend Quality Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ── 1. LINT ──────────────────────────────────────────────
      - name: "1️⃣  ESLint"
        run: npm run lint
        continue-on-error: false

      # ── 2. TYPECHECK ─────────────────────────────────────────
      - name: "2️⃣  TypeScript typecheck"
        run: npm run typecheck
        continue-on-error: false

      # ── 3. UNIT TESTS (Vitest) ───────────────────────────────
      - name: "3️⃣  Vitest unit tests"
        run: npm run test:coverage

      - name: Upload Vitest coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-coverage
          path: frontend/coverage/
          retention-days: 7

      # ── 4. STORYBOOK BUILD ───────────────────────────────────
      - name: "4️⃣  Storybook build"
        run: npm run storybook:build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload Storybook build
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: frontend/storybook-static/
          retention-days: 3

  # ─────────────────────────────────────────────────────────────
  # E2E + ACCESSIBILITY + VISUAL REGRESSION (Playwright)
  # ─────────────────────────────────────────────────────────────
  playwright:
    name: "🎭 Playwright (${{ matrix.project }})"
    runs-on: ubuntu-latest
    needs: [frontend-quality]
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium       # Desktop Chrome
          - firefox        # Desktop Firefox
          - webkit         # Desktop Safari
          - mobile-chrome  # Pixel 7
          - mobile-safari  # iPhone 14
          - lighthouse     # Chromium Lighthouse Audit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history for visual regression baseline comparison
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci --prefix . || true

      - name: Install frontend dependencies
        run: npm ci --prefix frontend --legacy-peer-deps

      - name: Install uv (for backend dev server)
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Install Playwright browsers
        run: npx playwright install ${{ matrix.project == 'mobile-chrome' && 'chromium' || matrix.project == 'mobile-safari' && 'webkit' || matrix.project == 'lighthouse' && 'chromium' || matrix.project }} --with-deps

      # Download visual regression baselines (uploaded by main branch)
      - name: Download visual regression baselines
        uses: actions/download-artifact@v4
        with:
          name: visual-baselines-${{ matrix.project }}
          path: e2e/__snapshots__
        continue-on-error: true  # First run: no baseline exists yet

      # ── E2E + A11Y + VISUAL REGRESSION ──────────────────────
      - name: "Run Playwright tests (E2E + Axe + Visual)"
        env:
          CI: true
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-fake-key-for-ci' }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || 'tvly-test-fake-key-for-ci' }}
        run: |
          npx playwright test \
            --project=${{ matrix.project }} \
            --reporter=html,list

      # Upload new snapshots as new baselines (only on main branch)
      - name: Upload visual regression baselines
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && always()
        with:
          name: visual-baselines-${{ matrix.project }}
          path: e2e/__snapshots__/
          retention-days: 90

      # Always upload test report and results for debugging
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (videos/screenshots on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # FINAL STATUS CHECK (required for branch protection rules)
  # ─────────────────────────────────────────────────────────────
  ci-success:
    name: "✅ All CI checks passed"
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-quality, playwright]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.backend-tests.result }}" != "success" ]]; then
            echo "❌ backend-tests failed"
            exit 1
          fi
          if [[ "${{ needs.frontend-quality.result }}" != "success" ]]; then
            echo "❌ frontend-quality failed"
            exit 1
          fi
          if [[ "${{ needs.playwright.result }}" != "success" ]]; then
            echo "❌ playwright tests failed"
            exit 1
          fi
          echo "✅ All CI jobs passed — safe to merge"
