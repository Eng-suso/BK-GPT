name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_CACHE_DIR: .uv-cache
      DELIR_FORCE_MOCK_EMBEDDINGS: "true"
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check backend/graphs backend/schemas backend/services tests

      - name: Mypy check
        run: uv run mypy

      - name: Compile Python sources
        run: uv run python -m compileall -q backend tests

      - name: Run pytest
        env:
          OPENAI_API_KEY: ""
          MEM0_API_KEY: ""
          TAVILY_API_KEY: ""
        run: uv run pytest tests/ -v --tb=short --junit-xml=pytest-results.xml

      - name: Upload pytest report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: pytest-results.xml
          retention-days: 7

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Vitest coverage
        run: npm run test:coverage

      - name: Upload Vitest coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-coverage
          path: frontend/coverage/
          retention-days: 7

      - name: Storybook build
        run: npm run storybook:build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload Storybook build
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storybook-static
          path: frontend/storybook-static/
          retention-days: 3

  playwright:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
          - firefox
          - webkit
          - mobile-chrome
          - mobile-safari
          - lighthouse

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend --legacy-peer-deps

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install Python dependencies
        env:
          UV_CACHE_DIR: .uv-cache
        run: uv sync --locked

      - name: Install Playwright browsers
        run: npx playwright install ${{ matrix.project == 'mobile-chrome' && 'chromium' || matrix.project == 'mobile-safari' && 'webkit' || matrix.project == 'lighthouse' && 'chromium' || matrix.project }} --with-deps

      - name: Download visual regression baselines
        uses: actions/download-artifact@v4
        with:
          name: visual-baselines-${{ matrix.project }}
          path: e2e/__snapshots__
        continue-on-error: true

      - name: Run Playwright tests
        env:
          CI: true
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-fake-key-for-ci' }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || 'tvly-test-fake-key-for-ci' }}
        run: npx playwright test --project=${{ matrix.project }} --reporter=html,list

      - name: Upload visual regression baselines
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && always()
        with:
          name: visual-baselines-${{ matrix.project }}
          path: e2e/__snapshots__/
          retention-days: 90

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 7

  ci-success:
    name: All CI checks passed
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality, playwright]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.backend-quality.result }}" != "success" ]]; then
            echo "backend-quality failed"
            exit 1
          fi
          if [[ "${{ needs.frontend-quality.result }}" != "success" ]]; then
            echo "frontend-quality failed"
            exit 1
          fi
          if [[ "${{ needs.playwright.result }}" != "success" ]]; then
            echo "playwright failed"
            exit 1
          fi
          echo "All CI jobs passed"
