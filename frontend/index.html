<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Suso GPT</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #070a16;
      --muted: #697182;
      --soft: #f6f7fa;
      --line: rgba(15, 23, 42, 0.10);
      --glass: rgba(255, 255, 255, 0.72);
      --glass-strong: rgba(255, 255, 255, 0.9);
      --shadow: 0 24px 70px rgba(15, 23, 42, 0.12);
      --shadow-soft: 0 12px 32px rgba(15, 23, 42, 0.08);
      --brand-a: #9ec5ff;
      --brand-b: #4c7df0;
      --navy: #070b22;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, Segoe UI, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.92), transparent 28%),
        linear-gradient(135deg, #eceef2 0%, #dfe2e7 45%, #eef0f4 100%);
      color: var(--ink);
      overflow: hidden;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .viewport {
      min-height: 100vh;
      padding: clamp(16px, 3.4vw, 56px);
      display: grid;
      place-items: center;
    }

    .shell {
      width: min(1240px, 100%);
      height: min(880px, calc(100vh - clamp(32px, 6.8vw, 112px)));
      min-height: 640px;
      display: grid;
      grid-template-columns: 66px 220px minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.86);
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.58);
      box-shadow: var(--shadow);
      backdrop-filter: blur(28px) saturate(1.18);
      -webkit-backdrop-filter: blur(28px) saturate(1.18);
    }

    .rail {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 22px 0;
      background: rgba(255, 255, 255, 0.52);
      border-right: 1px solid rgba(15, 23, 42, 0.04);
    }

    .brand-orb,
    .hero-orb {
      border-radius: 999px;
      background:
        radial-gradient(circle at 30% 22%, rgba(255, 255, 255, 0.85), transparent 23%),
        linear-gradient(145deg, var(--brand-a), var(--brand-b));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72), 0 12px 26px rgba(76, 125, 240, 0.28);
    }

    .brand-orb {
      width: 38px;
      height: 38px;
      margin-bottom: 8px;
    }

    .rail-button,
    .icon-button {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.82);
      border-radius: 999px;
      color: #5f6878;
      background: rgba(255, 255, 255, 0.68);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
      transition: transform 160ms ease, background 160ms ease, color 160ms ease;
    }

    .rail-button:hover,
    .icon-button:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.95);
      color: var(--ink);
    }

    .rail-button.active {
      color: #fff;
      background: var(--navy);
      border-color: rgba(255, 255, 255, 0.24);
      box-shadow: 0 16px 28px rgba(7, 11, 34, 0.22);
    }

    .rail-spacer {
      flex: 1;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 99px;
      background: #34c759;
      box-shadow: 0 0 0 4px rgba(52, 199, 89, 0.12);
    }

    .sidebar {
      min-width: 0;
      padding: 24px 14px;
      border-right: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.48);
    }

    .side-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .side-title {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .primary {
      width: 100%;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 0;
      border-radius: 19px;
      color: #fff;
      background: var(--navy);
      box-shadow: 0 14px 24px rgba(7, 11, 34, 0.22);
    }

    .section-label {
      margin: 22px 2px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #99a1af;
      font-size: 12px;
    }

    .history {
      display: grid;
      gap: 6px;
    }

    .history-item {
      width: 100%;
      min-height: 38px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 9px;
      border: 1px solid transparent;
      border-radius: 14px;
      background: transparent;
      color: var(--ink);
      text-align: left;
    }

    .history-item:hover,
    .history-item.active {
      background: rgba(255, 255, 255, 0.78);
      border-color: rgba(15, 23, 42, 0.06);
    }

    .avatar {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      color: #3064ce;
      background: #dcecff;
      font-size: 11px;
      font-weight: 700;
    }

    .history-text {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 12px;
    }

    .empty-history {
      margin: 10px 2px 0;
      color: #8b94a4;
      font-size: 12px;
      line-height: 1.45;
    }

    .upgrade {
      margin-top: auto;
      width: 100%;
      height: 36px;
      border: 1px solid rgba(15, 23, 42, 0.10);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.68);
      color: var(--ink);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.05);
    }

    .sidebar-inner {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: rgba(255, 255, 255, 0.64);
    }

    .topbar {
      height: 70px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .product {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .product strong {
      font-size: 14px;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .badge {
      padding: 3px 7px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: #838b9b;
      background: rgba(255, 255, 255, 0.54);
      font-size: 11px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pill {
      min-height: 34px;
      padding: 0 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 18px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.78);
      box-shadow: var(--shadow-soft);
      white-space: nowrap;
    }

    .pill.dark {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
      background: var(--navy);
      box-shadow: 0 14px 28px rgba(7, 11, 34, 0.20);
    }

    .content {
      min-height: 0;
      margin: 0 22px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 4px;
      background: rgba(248, 249, 251, 0.56);
    }

    .messages {
      flex: 1;
      min-height: 0;
      padding: 38px min(10vw, 116px) 26px;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .welcome {
      min-height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .welcome-inner {
      width: min(520px, 100%);
      transform: translateY(-4vh);
    }

    .hero-orb {
      width: 52px;
      height: 52px;
      margin: 0 auto 24px;
    }

    .welcome h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 4vw, 38px);
      line-height: 1;
      letter-spacing: 0;
    }

    .welcome p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .message-list {
      display: grid;
      gap: 16px;
    }

    .message {
      width: fit-content;
      max-width: min(690px, 84%);
      padding: 14px 16px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.76);
      box-shadow: 0 14px 34px rgba(15, 23, 42, 0.06);
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .message.user {
      margin-left: auto;
      color: #fff;
      border-color: transparent;
      background: linear-gradient(145deg, #0a1028, #111936);
      box-shadow: 0 18px 34px rgba(7, 11, 34, 0.20);
    }

    .message.assistant {
      margin-right: auto;
    }

    .message.markdown {
      white-space: normal;
    }

    .message.markdown > :first-child {
      margin-top: 0;
    }

    .message.markdown > :last-child {
      margin-bottom: 0;
    }

    .message.markdown p,
    .message.markdown ul,
    .message.markdown ol,
    .message.markdown pre,
    .message.markdown blockquote {
      margin: 0 0 12px;
    }

    .message.markdown h1,
    .message.markdown h2,
    .message.markdown h3 {
      margin: 14px 0 8px;
      letter-spacing: 0;
      line-height: 1.18;
    }

    .message.markdown h1 {
      font-size: 24px;
    }

    .message.markdown h2 {
      font-size: 20px;
    }

    .message.markdown h3 {
      font-size: 17px;
    }

    .message.markdown ul,
    .message.markdown ol {
      padding-left: 22px;
    }

    .message.markdown li {
      margin: 5px 0;
    }

    .message.markdown code {
      padding: 2px 5px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.06);
      font-family: "SF Mono", Consolas, monospace;
      font-size: 0.92em;
    }

    .message.markdown pre {
      overflow-x: auto;
      padding: 12px;
      border-radius: 14px;
      background: #0b1020;
      color: #f8fafc;
    }

    .message.markdown pre code {
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
    }

    .message.markdown blockquote {
      padding-left: 12px;
      border-left: 3px solid rgba(76, 125, 240, 0.42);
      color: #4b5565;
    }

    .message.markdown a {
      color: #245bd8;
      text-decoration: none;
    }

    .message.markdown a:hover {
      text-decoration: underline;
    }

    .composer-wrap {
      padding: 16px 22px 20px;
    }

    .composer {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 14px 14px 12px;
      border: 1px solid rgba(15, 23, 42, 0.10);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 22px 52px rgba(15, 23, 42, 0.10);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .composer textarea {
      width: 100%;
      max-height: 160px;
      min-height: 30px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.45;
    }

    .composer textarea::placeholder {
      color: #9aa3b2;
    }

    .composer-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
    }

    .left-tools,
    .right-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .select {
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: rgba(255, 255, 255, 0.82);
      color: var(--ink);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
      outline: 0;
    }

    .send {
      height: 36px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 0;
      border-radius: 18px;
      color: #fff;
      background: var(--navy);
      box-shadow: 0 14px 28px rgba(7, 11, 34, 0.20);
    }

    .send:disabled,
    .pill:disabled,
    .primary:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .footnote {
      margin-top: 12px;
      color: #7c8493;
      text-align: center;
      font-size: 11px;
    }

    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      max-width: 360px;
      padding: 12px 14px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: var(--shadow-soft);
      color: #313848;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    @media (max-width: 900px) {
      body {
        overflow: auto;
      }

      .viewport {
        padding: 0;
      }

      .shell {
        width: 100%;
        height: 100vh;
        min-height: 100vh;
        grid-template-columns: 56px minmax(0, 1fr);
        border-radius: 0;
      }

      .sidebar {
        display: none;
      }

      .topbar {
        padding: 0 14px;
      }

      .actions .pill:not(.dark) {
        display: none;
      }

      .content {
        margin: 0 12px;
      }

      .messages {
        padding: 26px 18px 18px;
      }

      .message {
        max-width: 94%;
      }

      .composer-wrap {
        padding: 12px;
      }

      .composer-tools {
        align-items: stretch;
        flex-direction: column;
      }

      .left-tools,
      .right-tools {
        justify-content: space-between;
      }

      .pill,
      .send,
      .select {
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <div class="viewport">
    <main class="shell" aria-label="Suso GPT chat">
      <nav class="rail" aria-label="Navigazione principale">
        <div class="brand-orb" aria-hidden="true"></div>
        <button class="rail-button active" title="Chat" aria-label="Chat">
          <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-11a8 8 0 1 1 18 0Z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></svg>
        </button>
        <button class="rail-button" title="Memoria" aria-label="Memoria">
          <svg viewBox="0 0 24 24"><path d="M12 3v18M7 7h10M7 17h10"/><path d="M5 5h14v14H5z"/></svg>
        </button>
        <button class="rail-button" title="Azioni" aria-label="Azioni">
          <svg viewBox="0 0 24 24"><path d="m13 2-8 12h7l-1 8 8-12h-7l1-8Z"/></svg>
        </button>
        <button class="rail-button" title="Impostazioni" aria-label="Impostazioni">
          <svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"/><path d="M19.4 15a1.8 1.8 0 0 0 .36 1.98l.06.06a2.1 2.1 0 0 1-2.97 2.97l-.06-.06a1.8 1.8 0 0 0-1.98-.36 1.8 1.8 0 0 0-1.09 1.65V21.3a2.1 2.1 0 0 1-4.2 0v-.09a1.8 1.8 0 0 0-1.09-1.65 1.8 1.8 0 0 0-1.98.36l-.06.06a2.1 2.1 0 1 1-2.97-2.97l.06-.06A1.8 1.8 0 0 0 3.6 15a1.8 1.8 0 0 0-1.65-1.09H1.86a2.1 2.1 0 0 1 0-4.2h.09A1.8 1.8 0 0 0 3.6 8.62a1.8 1.8 0 0 0-.36-1.98l-.06-.06A2.1 2.1 0 0 1 6.15 3.6l.06.06a1.8 1.8 0 0 0 1.98.36 1.8 1.8 0 0 0 1.09-1.65V2.28a2.1 2.1 0 0 1 4.2 0v.09a1.8 1.8 0 0 0 1.09 1.65 1.8 1.8 0 0 0 1.98-.36l.06-.06a2.1 2.1 0 0 1 2.97 2.97l-.06.06a1.8 1.8 0 0 0-.36 1.98 1.8 1.8 0 0 0 1.65 1.09h.09a2.1 2.1 0 0 1 0 4.2h-.09A1.8 1.8 0 0 0 19.4 15Z"/></svg>
        </button>
        <div class="rail-spacer"></div>
        <button class="rail-button" id="themeToggle" title="Aspetto" aria-label="Aspetto">
          <svg viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M3 12h2M19 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/><circle cx="12" cy="12" r="4"/></svg>
        </button>
        <div class="status-dot" title="Backend locale"></div>
      </nav>

      <aside class="sidebar">
        <div class="sidebar-inner">
          <div class="side-top">
            <h2 class="side-title">Chat</h2>
            <button class="icon-button" id="searchButton" title="Cerca" aria-label="Cerca">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            </button>
          </div>

          <button class="primary" id="newChatSide">
            <span>+</span>
            <span>Nuova chat</span>
            <svg viewBox="0 0 24 24"><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/></svg>
          </button>

          <div class="section-label">
            <span>Recenti</span>
            <span id="sessionCount">0</span>
          </div>
          <div class="history" id="historyList"></div>
          <p class="empty-history" id="emptyHistory">Le conversazioni appariranno qui dopo il primo messaggio.</p>

          <button class="upgrade" id="clearButton">Pulisci cronologia</button>
        </div>
      </aside>

      <section class="main">
        <header class="topbar">
          <div class="product">
            <strong>Suso GPT</strong>
            <span class="badge">Local</span>
          </div>
          <div class="actions">
            <button class="pill" id="configButton">
              <span>Configurazione</span>
              <svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"/><path d="M19 12h2M3 12h2M12 3v2M12 19v2"/></svg>
            </button>
            <button class="pill" id="shareButton">
              <span>Condividi</span>
              <svg viewBox="0 0 24 24"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 14v5h14v-5"/></svg>
            </button>
            <button class="pill dark" id="newChatTop">
              <span>Nuova chat</span>
              <svg viewBox="0 0 24 24"><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/></svg>
            </button>
          </div>
        </header>

        <div class="content">
          <div class="messages" id="messages">
            <div class="welcome" id="welcome">
              <div class="welcome-inner">
                <div class="hero-orb" aria-hidden="true"></div>
                <h1>Ciao, sono pronto.</h1>
                <p>Scrivi cosa ti serve e collego la conversazione al backend locale.</p>
              </div>
            </div>
            <div class="message-list" id="messageList" hidden></div>
          </div>
        </div>

        <div class="composer-wrap">
          <form class="composer" id="chatForm">
            <textarea id="prompt" rows="1" placeholder="Scrivi un messaggio..." autocomplete="off"></textarea>
            <div class="composer-tools">
              <div class="left-tools">
                <select class="select" id="modelSelect" aria-label="Modello">
                  <option value="gpt-5.6-luna">gpt-5.6-luna</option>
                </select>
              </div>
              <div class="right-tools">
                <button class="pill" type="button" id="attachButton">
                  <svg viewBox="0 0 24 24"><path d="m21.4 11.6-8.5 8.5a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 1 1 5.7 5.7l-9.2 9.2a2 2 0 1 1-2.8-2.8l8.5-8.5"/></svg>
                  <span>Allega</span>
                </button>
                <button class="pill" type="button" id="voiceButton">
                  <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>
                  <span>Voce</span>
                </button>
                <button class="send" type="submit" id="sendButton">
                  <svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
                  <span>Invia</span>
                </button>
              </div>
            </div>
          </form>
          <div class="footnote">Il modello puo commettere errori. Verifica sempre le risposte importanti.</div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const API_BASE = window.SUSO_API_BASE || (window.location.protocol === "file:" ? "http://127.0.0.1:8000" : "");

    const els = {
      form: document.getElementById("chatForm"),
      prompt: document.getElementById("prompt"),
      sendButton: document.getElementById("sendButton"),
      messages: document.getElementById("messages"),
      welcome: document.getElementById("welcome"),
      messageList: document.getElementById("messageList"),
      historyList: document.getElementById("historyList"),
      emptyHistory: document.getElementById("emptyHistory"),
      sessionCount: document.getElementById("sessionCount"),
      modelSelect: document.getElementById("modelSelect"),
      toast: document.getElementById("toast"),
    };

    const state = {
      currentThreadId: null,
      sessions: [],
      busy: false,
    };

    function activeSession() {
      return state.sessions.find((session) => session.threadId === state.currentThreadId) || null;
    }

    function sessionTitle(message) {
      const clean = message.trim().replace(/\s+/g, " ");
      return clean.length > 34 ? `${clean.slice(0, 34)}...` : clean || "Nuova chat";
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => els.toast.classList.remove("show"), 2800);
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g, "&#096;");
    }

    function safeUrl(url) {
      const trimmed = String(url || "").trim();

      if (/^(https?:|mailto:|\/)/i.test(trimmed)) {
        return trimmed;
      }

      return "#";
    }

    function renderInlineMarkdown(value) {
      let html = escapeHtml(value);
      html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
      html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, url) => {
        const href = escapeAttribute(safeUrl(url));
        return `<a href="${href}" target="_blank" rel="noreferrer">${label}</a>`;
      });
      return html;
    }

    function renderMarkdown(markdown) {
      const lines = String(markdown || "").replace(/\r\n/g, "\n").split("\n");
      const blocks = [];
      let paragraph = [];
      let list = null;
      let quote = [];
      let code = [];
      let inCode = false;

      const flushParagraph = () => {
        if (paragraph.length) {
          blocks.push(`<p>${renderInlineMarkdown(paragraph.join(" "))}</p>`);
          paragraph = [];
        }
      };

      const flushList = () => {
        if (list) {
          const tag = list.type === "ol" ? "ol" : "ul";
          blocks.push(`<${tag}>${list.items.map((item) => `<li>${renderInlineMarkdown(item)}</li>`).join("")}</${tag}>`);
          list = null;
        }
      };

      const flushQuote = () => {
        if (quote.length) {
          blocks.push(`<blockquote>${renderInlineMarkdown(quote.join(" "))}</blockquote>`);
          quote = [];
        }
      };

      for (const line of lines) {
        if (line.trim().startsWith("```")) {
          if (inCode) {
            blocks.push(`<pre><code>${escapeHtml(code.join("\n"))}</code></pre>`);
            code = [];
            inCode = false;
          } else {
            flushParagraph();
            flushList();
            flushQuote();
            inCode = true;
          }
          continue;
        }

        if (inCode) {
          code.push(line);
          continue;
        }

        if (!line.trim()) {
          flushParagraph();
          flushList();
          flushQuote();
          continue;
        }

        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          flushParagraph();
          flushList();
          flushQuote();
          const level = heading[1].length;
          blocks.push(`<h${level}>${renderInlineMarkdown(heading[2])}</h${level}>`);
          continue;
        }

        const unordered = line.match(/^\s*[-*]\s+(.+)$/);
        const ordered = line.match(/^\s*\d+\.\s+(.+)$/);
        if (unordered || ordered) {
          flushParagraph();
          flushQuote();
          const type = ordered ? "ol" : "ul";
          if (!list || list.type !== type) {
            flushList();
            list = { type, items: [] };
          }
          list.items.push((unordered || ordered)[1]);
          continue;
        }

        const blockquote = line.match(/^\s*>\s+(.+)$/);
        if (blockquote) {
          flushParagraph();
          flushList();
          quote.push(blockquote[1]);
          continue;
        }

        paragraph.push(line.trim());
      }

      if (inCode) {
        blocks.push(`<pre><code>${escapeHtml(code.join("\n"))}</code></pre>`);
      }

      flushParagraph();
      flushList();
      flushQuote();

      return blocks.join("") || "<p></p>";
    }

    async function parseApiError(response) {
      try {
        const data = await response.json();
        return data.detail || `Errore backend ${response.status}`;
      } catch {
        return `Errore backend ${response.status}`;
      }
    }

    function normalizeSession(session) {
      return {
        threadId: session.thread_id,
        title: session.title || "Nuova chat",
        modelName: session.model_name || null,
        createdAt: session.created_at,
        updatedAt: session.updated_at,
        messageCount: session.message_count || (session.messages ? session.messages.length : 0),
        messages: (session.messages || []).map((message) => ({
          id: message.id,
          role: message.role,
          content: message.content,
          createdAt: message.created_at,
        })),
      };
    }

    function upsertSession(session) {
      const normalized = normalizeSession(session);
      const index = state.sessions.findIndex((item) => item.threadId === normalized.threadId);

      if (index >= 0) {
        state.sessions[index] = {
          ...state.sessions[index],
          ...normalized,
        };
      } else {
        state.sessions.unshift(normalized);
      }

      state.sessions.sort((a, b) => String(b.updatedAt || "").localeCompare(String(a.updatedAt || "")));
      return activeSession() || normalized;
    }

    async function loadBackendSessions() {
      try {
        const response = await fetch(`${API_BASE}/v1/consultant-chat/sessions`);

        if (!response.ok) {
          throw new Error(await parseApiError(response));
        }

        const sessions = await response.json();
        state.sessions = sessions.map(normalizeSession);

        if (!state.currentThreadId && state.sessions.length > 0) {
          state.currentThreadId = state.sessions[0].threadId;
          await loadSessionDetail(state.currentThreadId);
        }
      } catch (error) {
        showToast(error.message || "Cronologia backend non disponibile.");
      } finally {
        renderHistory();
        renderMessages();
      }
    }

    async function loadSessionDetail(threadId) {
      const response = await fetch(`${API_BASE}/v1/consultant-chat/sessions/${threadId}`);

      if (!response.ok) {
        throw new Error(await parseApiError(response));
      }

      const session = await response.json();
      upsertSession(session);
      renderHistory();
      renderMessages();
    }

    async function createBackendSession() {
      const response = await fetch(`${API_BASE}/v1/consultant-chat/sessions`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model_name: els.modelSelect.value }),
      });

      if (!response.ok) {
        throw new Error(await parseApiError(response));
      }

      return response.json();
    }

    async function ensureSession(firstMessage = "") {
      const current = activeSession();
      if (current) return current;

      const data = await createBackendSession();
      const session = upsertSession({
        ...data,
        title: sessionTitle(firstMessage),
        messages: [],
      });
      state.currentThreadId = session.threadId;
      renderHistory();
      return session;
    }

    function renderHistory() {
      els.historyList.innerHTML = "";
      els.sessionCount.textContent = String(state.sessions.length);
      els.emptyHistory.hidden = state.sessions.length > 0;

      state.sessions.forEach((session) => {
        const item = document.createElement("button");
        item.className = `history-item${session.threadId === state.currentThreadId ? " active" : ""}`;
        item.type = "button";
        item.innerHTML = `
          <span class="avatar">${session.title.charAt(0).toUpperCase()}</span>
          <span class="history-text"></span>
        `;
        item.querySelector(".history-text").textContent = session.title;
        item.addEventListener("click", async () => {
          state.currentThreadId = session.threadId;
          renderHistory();
          renderMessages();
          try {
            await loadSessionDetail(session.threadId);
          } catch (error) {
            showToast(error.message || "Chat non caricata.");
          }
        });
        els.historyList.appendChild(item);
      });
    }

    function renderMessages() {
      const session = activeSession();
      const hasMessages = session && session.messages.length > 0;
      els.welcome.hidden = hasMessages;
      els.messageList.hidden = !hasMessages;
      els.messageList.innerHTML = "";

      if (!hasMessages) return;

      session.messages.forEach((message) => {
        const bubble = document.createElement("div");
        bubble.className = `message ${message.role}`;
        if (message.role === "assistant") {
          bubble.classList.add("markdown");
          bubble.innerHTML = renderMarkdown(message.content);
        } else {
          bubble.textContent = message.content;
        }
        els.messageList.appendChild(bubble);
      });

      els.messages.scrollTop = els.messages.scrollHeight;
    }

    function setBusy(value) {
      state.busy = value;
      els.sendButton.disabled = value;
      els.prompt.disabled = value;
    }

    async function sendMessage(content) {
      const session = await ensureSession(content);
      session.messages.push({ role: "user", content });
      session.title = session.title === "Nuova chat" ? sessionTitle(content) : session.title;
      renderHistory();
      renderMessages();

      const loading = { role: "assistant", content: "Sto elaborando..." };
      session.messages.push(loading);
      renderMessages();

      try {
        const response = await fetch(`${API_BASE}/v1/consultant-chat/sessions/${session.threadId}/messages/stream`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: content,
            model_name: els.modelSelect.value,
          }),
        });

        if (!response.ok) {
          throw new Error(await parseApiError(response));
        }

        if (!response.body) {
          throw new Error("Streaming non disponibile dal browser.");
        }

        loading.content = "";
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();

          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop() || "";

          for (const line of lines) {
            if (!line.trim()) continue;

            const event = JSON.parse(line);

            if (event.type === "delta") {
              loading.content += event.content || "";
              renderMessages();
            }

            if (event.type === "done") {
              loading.content = event.message || loading.content;
            }

            if (event.type === "error") {
              throw new Error(event.detail || "Errore streaming backend.");
            }
          }
        }

        await loadSessionDetail(session.threadId);
      } catch (error) {
        loading.content = error.message || `Non riesco a raggiungere il backend su ${API_BASE || window.location.origin}.`;
      } finally {
        renderMessages();
      }
    }

    function autoGrow() {
      els.prompt.style.height = "auto";
      els.prompt.style.height = `${Math.min(160, els.prompt.scrollHeight)}px`;
    }

    function startNewChat() {
      state.currentThreadId = null;
      renderHistory();
      renderMessages();
      els.prompt.focus();
    }

    document.getElementById("newChatSide").addEventListener("click", startNewChat);
    document.getElementById("newChatTop").addEventListener("click", startNewChat);
    document.getElementById("configButton").addEventListener("click", () => showToast(`API: ${API_BASE || "stessa origine"}`));
    document.getElementById("shareButton").addEventListener("click", async () => {
      const session = activeSession();
      const text = session ? session.messages.map((m) => `${m.role}: ${m.content}`).join("\n\n") : "Nessuna chat da condividere.";
      await navigator.clipboard?.writeText(text);
      showToast("Conversazione copiata negli appunti.");
    });
    document.getElementById("attachButton").addEventListener("click", () => showToast("Upload file non ancora esposto dal backend."));
    document.getElementById("voiceButton").addEventListener("click", () => showToast("Input vocale non ancora esposto dal backend."));
    document.getElementById("searchButton").addEventListener("click", () => showToast("Ricerca cronologia non ancora implementata."));
    document.getElementById("clearButton").addEventListener("click", async () => {
      try {
        const response = await fetch(`${API_BASE}/v1/consultant-chat/sessions`, {
          method: "DELETE",
        });

        if (!response.ok) {
          throw new Error(await parseApiError(response));
        }

        state.sessions = [];
        state.currentThreadId = null;
        renderHistory();
        renderMessages();
      } catch (error) {
        showToast(error.message || "Cronologia non eliminata.");
      }
    });
    document.getElementById("themeToggle").addEventListener("click", () => showToast("Tema Apple glass attivo."));

    els.prompt.addEventListener("input", autoGrow);
    els.prompt.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        els.form.requestSubmit();
      }
    });

    els.form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const content = els.prompt.value.trim();
      if (!content || state.busy) return;
      els.prompt.value = "";
      autoGrow();
      setBusy(true);
      await sendMessage(content);
      setBusy(false);
      els.prompt.focus();
    });

    renderHistory();
    renderMessages();
    autoGrow();
    loadBackendSessions();
  </script>
</body>
</html>
