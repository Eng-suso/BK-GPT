<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Area lavoro</title>
  <!-- Design Token System — Single Source of Truth -->
  <link rel="stylesheet" href="styles/tokens/index.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ─── Mapping All Component Styles Directly to Design Tokens ─── */
    :root {
      --bg-viewport: var(--slate-200);
      --bg-shell: var(--color-surface-primary);
      --bg-rail: var(--color-surface-secondary);
      --bg-sidebar: var(--color-surface-primary);
      --bg-main: var(--color-surface-secondary);
      
      --text-primary: var(--color-text-primary);
      --text-secondary: var(--color-text-secondary);
      --text-tertiary: var(--color-text-tertiary);
      
      --border-subtle: var(--color-border-subtle);
      --border-strong: var(--color-border-strong);
      
      --primary-dark: var(--color-surface-inverse);
      --primary-dark-hover: var(--slate-800);

      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: var(--layout-viewport-height, 100dvh);
      background-color: var(--bg-viewport);
      color: var(--text-primary);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }

    /* ── Utilities & Hidden Override ────────────────────────────── */
    [hidden], .welcome[hidden], .message-list[hidden] {
      display: none !important;
    }

    /* ── Outer Viewport & Ambient Glass Background ───────────── */

    .viewport {
      width: 100vw;
      height: 100vh;
      height: var(--layout-viewport-height, 100dvh);
      margin: 0;
      padding: 0;
      display: block;
      overflow: hidden;
      background:
        radial-gradient(circle at 10% 15%, rgba(219, 234, 254, 0.75), transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(224, 231, 255, 0.65), transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(243, 244, 246, 0.5), transparent 60%),
        #f8fafc;
    }

    .shell {
      width: 100%;
      height: 100%;
      max-width: 100%;
      display: grid;
      grid-template-columns: 66px 240px minmax(0, 1fr);
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      overflow: hidden;
      border: none;
      border-radius: 0;
      box-shadow: none;
    }

    /* ── Navigation Rail ────────────────────────────────────────── */

    .rail {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--space-500) 0;
      background: rgba(248, 250, 252, 0.65);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-right: 1px solid rgba(226, 232, 240, 0.8);
      gap: var(--space-300);
    }

    .brand-orb, .hero-orb, .assistant-avatar-orb {
      border-radius: var(--radius-full);
      background:
        radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.9), transparent 35%),
        linear-gradient(135deg, var(--blue-400), var(--blue-600));
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
    }

    .brand-orb {
      width: 42px;
      height: 42px;
      margin-bottom: var(--space-200);
    }

    .rail-btn, .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      display: grid;
      place-items: center;
      transition: all var(--motion-duration-fast) var(--motion-easing-standard);
    }

    .rail-btn:hover, .icon-btn:hover {
      background: rgba(255, 255, 255, 0.8);
      color: var(--text-primary);
      box-shadow: var(--elevation-surface);
    }

    .rail-btn.active {
      background: var(--primary-dark);
      color: var(--color-text-inverse);
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.25);
    }

    .rail-spacer { flex: 1; }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: var(--radius-full);
      background: var(--green-600);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.2);
    }

    /* ── Sidebar (Conversations Panel) ─────────────────────────── */

    .sidebar {
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-right: 1px solid rgba(226, 232, 240, 0.8);
      padding: var(--space-500) var(--space-400);
      min-width: 0;
      height: 100%;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-400);
    }

    .sidebar-title {
      font-size: var(--font-size-400);
      font-weight: var(--font-weight-bold);
      color: var(--text-primary);
      margin: 0;
    }

    .btn-new-chat {
      width: 100%;
      height: 40px;
      border-radius: var(--radius-full);
      background: var(--primary-dark);
      color: var(--color-text-inverse);
      border: none;
      font-size: var(--font-size-200);
      font-weight: var(--font-weight-medium);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-200);
      box-shadow: var(--elevation-raised);
      transition: all var(--motion-duration-fast) var(--motion-easing-standard);
      margin-bottom: var(--space-400);
    }

    .btn-new-chat:hover {
      background: var(--primary-dark-hover);
      transform: translateY(-1px);
    }

    .section-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: var(--font-weight-semibold);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-tertiary);
      margin: var(--space-300) var(--space-100) var(--space-200);
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-100);
      min-height: 0;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: var(--space-200);
      padding: 0 var(--space-300);
      height: 40px;
      border-radius: var(--radius-300);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      font-size: var(--font-size-200);
      text-align: left;
      transition: all var(--motion-duration-fast) var(--motion-easing-standard);
      width: 100%;
      cursor: pointer;
    }

    .history-item:hover {
      background: rgba(241, 245, 249, 0.8);
      border-color: rgba(226, 232, 240, 0.8);
      color: var(--text-primary);
    }

    .history-item.active {
      background: rgba(255, 255, 255, 0.9);
      border-color: var(--border-strong);
      font-weight: var(--font-weight-semibold);
      color: var(--text-primary);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .history-avatar {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
      border-radius: var(--radius-full);
      background: var(--blue-100);
      color: var(--blue-700);
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: var(--font-weight-bold);
    }

    .history-text {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .delete-btn {
      opacity: 0;
      width: 22px;
      height: 22px;
      border-radius: var(--radius-full);
      border: none;
      background: transparent;
      color: var(--text-tertiary);
      display: grid;
      place-items: center;
      transition: all var(--motion-duration-fast) var(--motion-easing-standard);
    }

    .history-item:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { background: var(--red-50); color: var(--red-600); }

    .btn-clear-history {
      margin-top: auto;
      width: 100%;
      height: 36px;
      border-radius: var(--radius-full);
      border: 1px solid rgba(226, 232, 240, 0.8);
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      color: var(--text-secondary);
      font-size: var(--font-size-100);
      font-weight: var(--font-weight-medium);
      transition: all var(--motion-duration-fast) var(--motion-easing-standard);
    }

    .btn-clear-history:hover { background: rgba(255, 255, 255, 0.95); color: var(--text-primary); }

    /* ── Main Chat Area & Topbar ────────────────────────────────── */

    .main {
      display: flex;
      flex-direction: column;
      background: transparent;
      height: 100%;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
    }

    .topbar {
      height: var(--space-1600);
      padding: 0 var(--space-600);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-400);
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
      flex-shrink: 0;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: var(--space-300);
      min-width: 0;
    }

    .chat-title {
      font-size: var(--font-size-300);
      font-weight: var(--font-weight-bold);
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 320px;
    }

    .badge-local {
      padding: 2px var(--space-200);
      border-radius: var(--radius-full);
      background: rgba(241, 245, 249, 0.8);
      border: 1px solid rgba(226, 232, 240, 0.8);
      color: var(--text-tertiary);
      font-size: 11px;
      font-weight: var(--font-weight-medium);
      flex-shrink: 0;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: var(--space-200);
      flex-shrink: 0;
    }

    .btn-pill-light {
      height: 36px;
      padding: 0 var(--space-400);
      border-radius: var(--radius-full);
      border: 1px solid rgba(226, 232, 240, 0.8);
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      color: var(--text-primary);
      font-size: var(--font-size-200);
      font-weight: var(--font-weight-medium);
      display: inline-flex;
      align-items: center;
      gap: var(--space-200);
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      transition: all var(--motion-duration-fast) var(--motion-easing-standard);
    }

    .btn-pill-light:hover {
      background: rgba(255, 255, 255, 0.95);
      border-color: var(--border-strong);
    }

    .btn-pill-light:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-pill-light.recording {
      background: var(--red-50);
      border-color: rgba(220, 38, 38, 0.28);
      color: var(--red-600);
    }

    /* ── Content & Messages ─────────────────────────────────────── */

    .content {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: var(--space-600);
      scroll-behavior: smooth;
    }

    /* Empty state */
    .welcome {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-600) var(--space-400);
    }

    .welcome-inner {
      width: min(calc(100% - 48px), 1040px);
      margin: 0 auto;
    }

    .hero-orb {
      width: 56px;
      height: 56px;
      margin: 0 auto var(--space-400);
    }

    .welcome h1 {
      font-size: var(--font-size-600);
      font-weight: var(--font-weight-bold);
      color: var(--text-primary);
      margin: 0 0 var(--space-200);
      letter-spacing: -0.02em;
    }

    .welcome p {
      font-size: var(--font-size-300);
      color: var(--text-secondary);
      margin: 0 0 var(--space-800);
    }



    .message-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-600);
      width: min(calc(100% - 48px), 1040px);
      margin-inline: auto;
    }

    .message {
      width: fit-content;
      max-width: 80%;
      font-size: 15px;
      line-height: 1.6;
    }

    .message.user {
      margin-left: auto;
      color: var(--text-primary);
      background: rgba(226, 232, 240, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 10px 18px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      border: 1px solid rgba(203, 213, 225, 0.8);
      white-space: pre-wrap;
      width: fit-content;
      max-width: 75%;
    }

    .message.assistant.markdown {
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border: none;
      border-radius: 0;
      padding: 4px 0;
      box-shadow: none;
      color: var(--text-primary);
      width: 100%;
      max-width: 100%;
    }

    .message.error-bubble {
      margin-right: auto;
      width: 100%;
      border: var(--border-width-100) solid var(--domain-role-danger-border);
      background: var(--domain-role-danger-surface);
      color: var(--domain-role-danger-text);
      border-radius: var(--radius-400);
    }

    .error-bubble-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-300);
    }

    .retry-btn {
      height: 30px;
      padding: 0 var(--space-300);
      border-radius: var(--radius-full);
      border: var(--border-width-100) solid var(--domain-role-danger-border);
      background: var(--color-surface-primary);
      color: var(--domain-role-danger-text);
      font-size: var(--font-size-100);
      font-weight: var(--font-weight-semibold);
    }

    /* Markdown Rich Styling */
    .message.markdown { white-space: normal; line-height: 1.6; }
    .message.markdown p { margin: 0 0 var(--space-300); }
    .message.markdown p:last-child { margin-bottom: 0; }
    
    .message.markdown h1, .message.markdown h2, .message.markdown h3, .message.markdown h4 {
      color: var(--text-primary);
      margin: var(--space-400) 0 var(--space-200);
      font-weight: var(--font-weight-bold);
    }
    .message.markdown h1 { font-size: 1.35em; }
    .message.markdown h2 { font-size: 1.18em; }
    .message.markdown h3 { font-size: 1.08em; }
    
    .message.markdown ul, .message.markdown ol {
      margin: 0 0 var(--space-300);
      padding-left: var(--space-600);
    }
    .message.markdown li {
      margin-bottom: var(--space-100);
    }

    .message.markdown code {
      padding: 2px 6px;
      border-radius: var(--radius-200);
      background: rgba(15, 23, 42, 0.07);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.88em;
    }

    .message.markdown pre {
      overflow-x: auto;
      padding: var(--space-400);
      border-radius: var(--radius-400);
      background: var(--slate-900);
      color: var(--slate-50);
      margin: var(--space-300) 0;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.15);
    }

    .message.markdown pre code {
      background: transparent;
      padding: 0;
      color: inherit;
      font-size: 0.9em;
    }

    .message.markdown blockquote {
      border-left: 3px solid var(--blue-500);
      margin: var(--space-300) 0;
      padding: var(--space-200) var(--space-400);
      color: var(--text-secondary);
      background: rgba(59, 130, 246, 0.06);
      border-radius: 0 var(--radius-300) var(--radius-300) 0;
    }

    .message.markdown table {
      width: 100%;
      border-collapse: collapse;
      margin: var(--space-300) 0;
    }

    .message.markdown th, .message.markdown td {
      border: var(--border-width-100) solid var(--border-subtle);
      padding: var(--space-200) var(--space-300);
      text-align: left;
    }

    .message.markdown th {
      background: rgba(241, 245, 249, 0.8);
      font-weight: var(--font-weight-semibold);
    }

    .message.markdown a {
      color: var(--blue-600);
      text-decoration: underline;
    }

    /* ── Floating Capsule Composer (Glassmorphism) ──────────── */

    .composer-wrap {
      padding: var(--space-400) var(--space-600) var(--space-600);
      flex-shrink: 0;
      container-type: inline-size;
      container-name: composer-wrap;
    }

    .interview-panel {
      width: min(calc(100% - 48px), 1040px);
      margin: 0 auto var(--space-300);
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: var(--radius-400);
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
      padding: var(--space-400);
    }

    .interview-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-400);
      margin-bottom: var(--space-300);
    }

    .interview-title {
      color: var(--text-primary);
      font-size: 14px;
      font-weight: var(--font-weight-bold);
    }

    .interview-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-200);
      margin-top: var(--space-100);
      color: var(--text-tertiary);
      font-size: 12px;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 var(--space-200);
      border-radius: var(--radius-full);
      background: var(--state-warning-surface);
      color: var(--state-warning-text);
      border: 1px solid var(--state-warning-border);
      font-size: 11px;
      font-weight: var(--font-weight-semibold);
    }

    .status-chip.online {
      background: var(--state-success-surface);
      color: var(--state-success-text);
      border-color: var(--state-success-border);
    }

    .interview-transcript {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: var(--space-300);
    }

    .transcript-column {
      min-width: 0;
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: var(--radius-300);
      background: rgba(248, 250, 252, 0.85);
      overflow: hidden;
    }

    .transcript-column.final {
      background: rgba(240, 253, 244, 0.72);
      border-color: var(--green-200);
    }

    .transcript-label {
      height: 32px;
      display: flex;
      align-items: center;
      padding: 0 var(--space-300);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: var(--font-weight-semibold);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid rgba(226, 232, 240, 0.85);
    }

    .transcript-body {
      height: 112px;
      overflow-y: auto;
      padding: var(--space-300);
      color: var(--text-primary);
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .composer-box {
      width: min(calc(100% - 48px), 1040px);
      margin-inline: auto;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      padding: 16px 20px 12px;
      box-shadow: 0 12px 36px rgba(15, 23, 42, 0.07), 0 0 0 1px rgba(255, 255, 255, 0.8) inset;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .composer-box:focus-within {
      background: rgba(255, 255, 255, 0.96);
      border-color: rgba(59, 130, 246, 0.5);
      box-shadow: 0 20px 50px rgba(59, 130, 246, 0.14), 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .composer-box textarea {
      width: 100%;
      border: none;
      outline: none;
      font-size: 15px;
      line-height: 1.55;
      font-family: inherit;
      color: var(--text-primary);
      background: transparent;
      resize: none;
      min-height: 42px;
      max-height: 180px;
      padding: 4px 2px 6px;
    }

    .composer-box textarea::placeholder {
      color: var(--text-tertiary);
      font-weight: var(--font-weight-regular);
      opacity: 0.85;
    }

    .composer-status {
      min-height: 18px;
      color: var(--text-tertiary);
      font-size: 12px;
      line-height: 1.5;
      padding-inline: 2px;
    }

    .composer-bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-300);
      padding-top: 4px;
    }

    .model-select {
      height: 34px;
      padding: 0 14px;
      border-radius: var(--radius-full);
      border: 1px solid rgba(226, 232, 240, 0.8);
      background: rgba(241, 245, 249, 0.8);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: var(--font-weight-medium);
      outline: none;
      cursor: pointer;
      transition: all var(--motion-duration-fast) var(--motion-easing-standard);
    }

    .model-select:hover {
      background: rgba(255, 255, 255, 0.9);
      border-color: var(--border-strong);
    }

    .composer-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-send {
      height: 36px;
      padding: 0 var(--space-400);
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #ffffff;
      border: none;
      font-size: 13px;
      font-weight: var(--font-weight-semibold);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.22);
      transition: all var(--motion-duration-fast) var(--motion-easing-standard);
      cursor: pointer;
    }

    .btn-send:hover:not(:disabled) {
      background: linear-gradient(135deg, #1e293b, #334155);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.3);
    }

    .btn-send:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    /* Container query for progressive disclosure on small screens */
    @container composer-wrap (max-width: 540px) {
      .composer-actions .btn-pill-light span {
        display: none;
      }
      .composer-actions .btn-pill-light {
        padding: 0 var(--space-200);
        min-width: 34px;
      }
      .interview-toolbar {
        align-items: stretch;
        flex-direction: column;
      }
      .interview-transcript {
        grid-template-columns: 1fr;
      }
      .transcript-body {
        height: 92px;
      }
    }

    .footnote {
      margin-top: var(--space-200);
      color: var(--text-tertiary);
      text-align: center;
      font-size: 11px;
    }

    /* ── SVG Icons ──────────────────────────────────────────────── */

    svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* ── Toast ──────────────────────────────────────────────────── */

    .toast {
      position: fixed;
      right: var(--space-600);
      bottom: var(--space-600);
      max-width: 360px;
      padding: var(--space-300) var(--space-400);
      border-radius: var(--radius-400);
      background: var(--slate-900);
      color: var(--color-text-inverse);
      font-size: 13px;
      box-shadow: var(--elevation-overlay);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: all var(--motion-duration-fast) var(--motion-easing-standard);
      z-index: var(--z-index-3200);
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Responsive Rules (3 Mutually Exclusive Breakpoint States) ── */

    .menu-toggle { display: none; }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: calc(var(--z-index-1600) - 1);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--motion-duration-moderate) var(--motion-easing-standard);
    }

    /* STATE C — Desktop (≥ 1100px) */
    @media (min-width: 1100px) {
      .shell {
        grid-template-columns: 66px 240px minmax(0, 1fr);
      }
      .sidebar {
        position: relative;
        left: 0;
        top: 0;
        bottom: 0;
        width: 100%;
        max-width: 100%;
        transform: none !important;
        box-shadow: none !important;
        background: #ffffff;
        z-index: 1;
      }
      .sidebar-backdrop {
        display: none !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
      .menu-toggle {
        display: none !important;
      }
    }

    /* STATE B — Tablet Landscape / Compact Window (900px – 1099px) */
    @media (min-width: 900px) and (max-width: 1099px) {
      .menu-toggle { display: grid; }
      .shell { grid-template-columns: 66px minmax(0, 1fr); }
      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 66px;
        width: 280px;
        max-width: calc(100vw - 66px);
        z-index: calc(var(--z-index-1600) + 1);
        transform: translateX(-100%);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: transform 0.25s ease, opacity 0.25s ease, visibility 0.25s ease;
        background: #ffffff;
        box-shadow: 0 10px 40px rgba(15, 23, 42, 0.15);
      }
      .sidebar.open {
        transform: translateX(0);
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }
      .sidebar-backdrop { display: block; }
      .sidebar-backdrop.open { opacity: 1; pointer-events: auto; }
    }

    /* STATE A — Mobile / Tablet Portrait (< 900px) */
    @media (max-width: 899px) {
      .menu-toggle { display: grid; }
      .shell { grid-template-columns: 56px minmax(0, 1fr); }
      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 56px;
        width: 280px;
        max-width: calc(100vw - 56px);
        z-index: calc(var(--z-index-1600) + 1);
        transform: translateX(-100%);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: transform 0.25s ease, opacity 0.25s ease, visibility 0.25s ease;
        background: #ffffff;
        box-shadow: 0 10px 40px rgba(15, 23, 42, 0.15);
      }
      .sidebar.open {
        transform: translateX(0);
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }
      .sidebar-backdrop { display: block; }
      .sidebar-backdrop.open { opacity: 1; pointer-events: auto; }
      .topbar { padding: 0 var(--space-400); }
      .composer-wrap {
        padding: var(--space-300);
        padding-bottom: max(var(--space-300), env(safe-area-inset-bottom));
      }
    }

    @media (max-width: 639px) {
      .topbar-right .btn-pill-light span { display: none; }
      .topbar { height: 54px; }
      .suggestions-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
