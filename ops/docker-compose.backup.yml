# Backup notturno della produzione: database e file caricati, cifrati, su OCI
# Object Storage. Si aggiunge al compose di produzione:
#
#   cd ops
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.backup.yml up -d
#
# Runbook (configurazione, ripristino, prova trimestrale): ops/backup/README.md.
# Sta in un file a parte perche' gli stack locali (staging, prod-sim) non hanno
# un bucket e non devono fare backup.

services:
  backup:
    build:
      context: ./backup
    image: delir-backup:${DELIR_IMAGE_TAG:-pilot}
    container_name: delir-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: delir_super
      PGPASSWORD: ${POSTGRES_SUPER_PASSWORD:?serve POSTGRES_SUPER_PASSWORD}
      # Chiave PUBBLICA: la VM cifra e non sa decifrare.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?serve BACKUP_AGE_RECIPIENT (chiave pubblica age)}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-oci:delir-backup/prod}
      BACKUP_AT: ${BACKUP_AT:-02:30}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_ON_START: ${BACKUP_ON_START:-true}
      BACKUP_APPDATA_DIR: /appdata
      # OCI Object Storage tramite l'API compatibile S3 (Customer Secret Key).
      RCLONE_CONFIG_OCI_TYPE: s3
      RCLONE_CONFIG_OCI_PROVIDER: Other
      RCLONE_CONFIG_OCI_ENDPOINT: ${OCI_S3_ENDPOINT:?serve OCI_S3_ENDPOINT (https://<namespace>.compat.objectstorage.<regione>.oraclecloud.com)}
      RCLONE_CONFIG_OCI_REGION: ${OCI_S3_REGION:?serve OCI_S3_REGION}
      RCLONE_CONFIG_OCI_ACCESS_KEY_ID: ${OCI_S3_ACCESS_KEY:?serve OCI_S3_ACCESS_KEY}
      RCLONE_CONFIG_OCI_SECRET_ACCESS_KEY: ${OCI_S3_SECRET_KEY:?serve OCI_S3_SECRET_KEY}
      RCLONE_CONFIG_OCI_FORCE_PATH_STYLE: "true"
      RCLONE_CONFIG_OCI_NO_CHECK_BUCKET: "true"
    volumes:
      - delir_appdata:/appdata:ro
      - delir_backup_status:/status
    healthcheck:
      test: ["CMD", "/backup/run.sh", "health"]
      interval: 10m
      timeout: 30s
      # Il primo backup parte all'avvio e dura qualche minuto.
      start_period: 30m
      retries: 1
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  delir_backup_status:
    name: delir_backup_status
