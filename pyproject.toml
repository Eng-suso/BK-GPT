[project]
name = "suso-gpt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bs4>=0.0.2",
    "fastapi==0.136.3",
    "ipykernel>=7.3.0",
    "jinja2==3.1.6",
    "langchain==1.3.2",
    "langchain-community>=0.4.2",
    "langchain-core==1.4.0",
    "langchain-openai>=1.2.2",
    "langchain-tavily==0.2.18",
    "langchain-text-splitters==1.1.2",
    "langgraph==1.2.2",
    "mem0ai>=2.0.17",
    "openai>=2.53.0",
    "pandas>=3.0.5",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.29",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "sqlalchemy==2.0.50",
    "tavily-python==0.7.24",
    "uvicorn==0.48.0",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "en-core-web-sm",
    "neo4j>=5.28",
    "langgraph-checkpoint-postgres>=3.1.2",
    "openpyxl>=3.1.5",
    "docling-core[chunking]>=2.99.0",
    "pypdfium2>=5.13.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "ruff>=0.15.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "agent_eval: valuta la qualita' del lavoro dell'agente con LLM reale; richiede DELIR_AGENT_EVAL=1",
    "live_llm: puo' chiamare il provider e spendere; richiede DELIR_LIVE_LLM=1 (vedi tests/live_llm.py)",
    "smoke: controlli rapidi dopo ogni deploy (l'app parte, risponde, si difende); uv run pytest -m smoke",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# E9/F: errori di sintassi e pyflakes (nomi indefiniti, import morti).
# B: bugbear, i difetti che un test spesso non vede (zip che tronca, eccezioni
# cieche nei test). E71x/E72x: confronti con None/True e except nudi.
select = ["E9", "F", "B", "E711", "E712", "E721", "E722"]
# B008: FastAPI dichiara le dipendenze come default (`Depends`, `Header`, `Form`).
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Gli __init__ ri-esportano: l'import e' l'API del pacchetto.
"__init__.py" = ["F401"]
# Le fixture importate da un modulo e poi chieste come argomento sembrano ridefinite.
"tests/**" = ["F811"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
explicit_package_bases = true
follow_imports = "skip"
files = [
    # Il gateway e' il punto da cui passa ogni chiamata al modello: se i tipi
    # cedono qui, cede la misura della spesa.
    "backend/llm",
    "backend/graphs/routing_contracts.py",
    "backend/graphs/consulting/graph.py",
    "backend/graphs/project/graph.py",
    "backend/graphs/process/graph.py",
    "backend/graphs/canvas_edit/graph.py",
    "backend/schemas",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
